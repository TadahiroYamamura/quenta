# 保証の台帳。書き方は CLAUDE.md の「保証の台帳と用語集」

# ---- 用語 ----

[[term]]
id = "task"
name = "タスク"
definition = "利用者が AI に頼んだ、やること"

[[term]]
id = "task-id"
name = "タスクの ID"
definition = "タスクを見分ける値。16 進の小文字 8 桁のランダムな値"
part_of = "task"

[[term]]
id = "task-title"
name = "タイトル"
definition = "タスクの見出し"
part_of = "task"

[[term]]
id = "task-body"
name = "本文"
definition = "タスクの詳しい説明"
part_of = "task"

[[term]]
id = "task-status"
name = "状態"
definition = "タスクの進み具合。todo（完了も中止もしていない）、done（完了）、canceled（中止）のどれか。todo を終わっていない状態、done と canceled を終わった状態と呼ぶ"
part_of = "task"

[[term]]
id = "task-created-at"
name = "作成日時"
definition = "タスクを登録した日時"
part_of = "task"

[[term]]
id = "event"
name = "イベント"
definition = "タスクの状態の変更の記録。主体、変更前の状態（登録のイベントではなし）、変更後の状態、理由、日時を持つ。1 つのタスクのイベントは、記録した順番（記録の順）を持つ"

[[term]]
id = "event-actor"
name = "主体"
definition = "イベントを起こした操作を行ったセッション"
part_of = "event"

[[term]]
id = "event-reason"
name = "理由"
definition = "完了・中止にした理由。登録のイベントでは空"
part_of = "event"

[[term]]
id = "session"
name = "セッション"
definition = "quenta を使う AI の、1 回の作業の単位。環境変数 QUENTA_SESSION の値で表す"

[[term]]
id = "blank"
name = "空白だけ"
definition = "文字が 1 つもないか、空白の文字だけでできていること。空白の文字は、Unicode で White_Space の性質を持つ文字（半角・全角の空白、タブ、改行など）"

[[term]]
id = "error-code"
name = "エラーコード"
definition = "失敗したときに JSON で返す、失敗の種類を表す文字列"

[[term]]
id = "data-file"
name = "データのファイル"
definition = "タスクとイベントを置く SQLite のデータベースのファイル。quenta.db という名前で、置き場所は主張「データの置き場所」（data-location）のとおり"

# ---- 機能 ----

[[feature]]
id = "task-add"
name = "タスクの登録"
definition = "タイトルと本文を指定して、タスクを加える（quenta task add --title <タイトル> [--body <本文>]）"
formal = true

[[feature]]
id = "task-list"
name = "タスクの一覧"
definition = "タスクを並べて返す（quenta task list [--all]）"
formal = true
rationale = "念入りにしても、モデルを作る負担はそんなに増えない"

[[feature]]
id = "task-show"
name = "タスクの表示"
definition = "ID を指定して、タスクの内容とイベントを返す（quenta task show <ID>）"

[[feature]]
id = "task-done"
name = "タスクの完了"
definition = "ID と理由を指定して、タスクを done にする（quenta task done <ID> --reason <理由>）"
formal = true

[[feature]]
id = "task-cancel"
name = "タスクの中止"
definition = "ID と理由を指定して、タスクを canceled にする（quenta task cancel <ID> --reason <理由>）"
formal = true

[[feature]]
id = "install"
name = "インストール"
definition = "リポジトリから quenta を入れる（make install）"

# ---- 主張 ----
# 層ごとに分ける（CLAUDE.md の「保証の台帳と用語集」）。モデルの層は、状態と操作の判定・遷移

# -- モデルの層 --

[[claim]]
id = "task-add-saves-todo"
subjects = ["task-add", "task", "task-status"]
statement = "タイトルと本文を渡して登録すると、状態が todo のタスクが 1 つ加わる。タイトルと本文は、渡された値のまま（前後の空白を含む）。作成日時は、渡された日時"
condition = "登録のエラーの条件（主張 session-required・task-add-title-required・task-add-id-taken）のどれにも当てはまらないとき"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "task-add-empty-body"
subjects = ["task-add", "task-body"]
statement = "渡された本文が何であっても（空、空白だけを含む）、本文を理由に登録を拒まない。加わったタスクの本文は、渡された値のまま。渡される本文は、CLI の層で正しい UTF-8 だと確かめたもの（主張 cli-invalid-utf8）"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "プロパティベーステスト"
detail = "空・空白だけ（半角・全角の空白、タブ、改行）・前後に空白がある・長い・多言語の文字の本文を境界として必ず含め、残りを無作為に作る。主体とタイトルは空白だけでなく ID も重ならない入力で、登録が成功し本文がそのまま入ることを、モデルの事後条件で判定する"

[[claim]]
id = "task-add-title-required"
subjects = ["task-add", "task-title", "blank"]
statement = "タイトルが空白だけなら、登録せず、エラー title_required を返す。タスクもイベントも変えない"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "プロパティベーステスト"
detail = "空白だけのタイトル（空白の文字を組み合わせたもの）で、title_required になり何も変わらないことを判定する"

[[claim]]
id = "task-add-records-event"
subjects = ["task-add", "event"]
statement = "登録すると、主体・変更前なし・変更後 todo・日時を持ち、理由が空のイベントが 1 件記録される。そのイベントの日時は、渡された日時（タスクの作成日時と同じ）"
condition = "登録のエラーの条件（主張 session-required・task-add-title-required・task-add-id-taken）のどれにも当てはまらないとき"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "task-id-unique"
subjects = ["task-id", "task-add"]
statement = "タスクの ID は重ならない"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "task-add-id-taken"
subjects = ["task-add", "task-id"]
statement = "渡された ID が登録済みの ID と重なっている（渡された事実が「重なる」）なら、登録せず、ID が重なったことを返す。タスクもイベントも変えない"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "プロパティベーステスト"
detail = "登録済みの ID を渡し、登録されず重なりが返ることを判定する"

[[claim]]
id = "task-list-unfinished"
subjects = ["task-list", "task-status"]
statement = "終わったタスクを含めないと指定された一覧は、渡されたタスクの集まりのうち、終わっていない状態のタスクを、漏れなく、それだけ、1 度ずつ返す"
condition = "主体が空白だけでなく（主張 session-required）、渡された集まりの ID が重ならないとき（主張 db-task-id-unique・db-facts-as-read）"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "task-list-all"
subjects = ["task-list", "task-status"]
statement = "終わったタスクを含めると指定された一覧は、渡されたタスクの集まりを、漏れなく、それだけ、1 度ずつ返す"
condition = "主体が空白だけでなく（主張 session-required）、渡された集まりの ID が重ならないとき（主張 db-task-id-unique・db-facts-as-read）"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "task-list-order"
subjects = ["task-list", "task-created-at"]
statement = "一覧は作成日時の古い順に並ぶ。作成日時が同じなら、ID の昇順（文字の順）に並ぶ"
condition = "主体が空白だけでなく（主張 session-required）、渡された集まりの ID が重ならないとき（主張 db-task-id-unique・db-facts-as-read）"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim.evidence]]
stage = "テスト"
means = "プロパティベーステスト"
detail = "作成日時が同じタスクを含む集まりを直接作り、並びをモデルで判定する"

[[claim]]
id = "task-done-sets-done"
subjects = ["task-done", "task-status", "event"]
statement = "理由を渡して todo のタスクを完了にすると、状態が done になり、主体・変更前 todo・変更後 done・理由・日時のイベントが 1 件記録される。理由は、渡された値のまま（前後の空白を含む）。日時は、渡された日時"
condition = "完了・中止のエラーの条件（主張 session-required・finish-reason-required・task-not-found・finished-task-unchangeable）のどれにも当てはまらないとき"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "task-cancel-sets-canceled"
subjects = ["task-cancel", "task-status", "event"]
statement = "理由を渡して todo のタスクを中止にすると、状態が canceled になり、主体・変更前 todo・変更後 canceled・理由・日時のイベントが 1 件記録される。理由は、渡された値のまま（前後の空白を含む）。日時は、渡された日時"
condition = "完了・中止のエラーの条件（主張 session-required・finish-reason-required・task-not-found・finished-task-unchangeable）のどれにも当てはまらないとき"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "finish-reason-required"
subjects = ["event-reason", "task-done", "task-cancel", "blank"]
statement = "理由が空白だけなら、完了にも中止にもせず、エラー reason_required を返す。タスクもイベントも変えない"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "プロパティベーステスト"
detail = "空白だけの理由で、reason_required になり何も変わらないことを判定する"

[[claim]]
id = "finished-task-unchangeable"
subjects = ["task-status", "task-done", "task-cancel"]
statement = "渡されたタスクが終わった状態なら、完了にも中止にもせず、エラー already_finished を返す。タスクもイベントも変えない"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "task-not-found"
subjects = ["task-id", "task-done", "task-cancel"]
statement = "指定した ID のタスクがない（渡された事実が「見つからない」）なら、完了にも中止にもせず、エラー not_found を返す。タスクもイベントも変えない"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "session-required"
subjects = ["session", "blank", "task-add", "task-list", "task-done", "task-cancel"]
statement = "主体が空白だけなら、登録・一覧・完了・中止のどれも、エラー session_required を返す。タスクもイベントも変えない"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "プロパティベーステスト"
detail = "空白だけの主体で、どの操作も session_required になることを判定する"

[[claim]]
id = "event-actor-as-given"
subjects = ["event-actor", "task-add", "task-done", "task-cancel"]
statement = "イベントの主体は、その操作に渡された主体の値のまま（前後の空白を含む）"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim]]
id = "model-changes-only-target"
subjects = ["task-add", "task-done", "task-cancel", "task", "event"]
statement = "登録が成功したときは、タスクを 1 つとそのイベントを 1 件加えるほかは、何も変えない。完了・中止が成功したときは、指定したタスクの状態を変え、そのタスクにイベントを 1 件足すほかは、何も変えない（そのタスクのタイトル・本文・作成日時、ほかのタスクとそのイベントを含む）。一覧は、成功しても失敗しても何も変えない。登録・完了・中止が失敗したときに何も変えないことは、それぞれのエラーの主張が言う"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送り、1 歩ごとに状態の全体を比べる"

[[claim]]
id = "model-errors-only-when"
subjects = ["task-add", "task-list", "task-done", "task-cancel"]
statement = "モデルがエラーを返すのは、エラーの主張（session-required・task-add-title-required・finish-reason-required・task-not-found・finished-task-unchangeable・task-add-id-taken）に書いた条件のどれかが当てはまるときだけ"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "エラーごとの同値（<==>）の補題"

[[claim.evidence]]
stage = "テスト"
means = "プロパティベーステスト"
detail = "エラーの条件の境界の入力（空白でない文字を 1 つだけ含む主体・タイトル・理由、todo のタスク、登録済みでない ID）を必ず含め、どの条件にも当てはまらない入力で操作が成功することを判定する"

[[claim]]
id = "model-error-precedence"
subjects = ["task-add", "task-list", "task-done", "task-cancel"]
statement = "モデルの判定するエラーの条件が複数当てはまるときは、主張 error-precedence の順のうち、モデルが判定するエラーの順に従い、先に当てはまったものを返す。モデルが判定するエラーは、already_finished・not_found・reason_required・session_required・title_required と ID の重なり（id_conflict の位置）で、この並びは順位ではない"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "プロパティベーステスト"
detail = "複数のエラーの条件が当てはまる入力で、返るエラーをモデルと比べる"

[[claim]]
id = "finished-task-preserved"
subjects = ["task-status", "task", "task-add", "task-done", "task-cancel"]
statement = "終わった状態のタスクは、登録・完了・中止のどの操作の後も、同じ値のまま残る"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明（操作の前と後の状態を比べる補題）"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送り、1 歩ごとに状態の全体を比べる"

[[claim]]
id = "status-matches-last-event"
subjects = ["task-status", "event"]
statement = "タスクの状態は、そのタスクの、記録の順で最後のイベントの変更後の状態と一致する"

[[claim.evidence]]
stage = "計画"
means = "証明"
detail = "仕様の証明"

[[claim.evidence]]
stage = "テスト"
means = "モデルベーステスト"
detail = "登録・一覧・完了・中止の操作の列を、モデルと実装に送って比べる"

[[claim.evidence]]
stage = "運用"
means = "実行時の確認"
detail = "不変条件を、コミット前に、メモリから確かめる（書き込もうとしているタスクの状態と、そのタスクの最後のイベントの変更後を比べる）。保存が正しいことは主張 db-roundtrip・db-events-in-record-order・db-writes-as-model を前提にする"

# -- ID を作る部分（モデルの外） --

[[claim]]
id = "task-id-format"
subjects = ["task-id"]
statement = "登録で作るタスクの ID は、16 進の小文字 8 桁のランダムな値"

[[claim.evidence]]
stage = "テスト"
means = "単体テスト"
detail = "作った ID の形を、たくさん作って確かめる"

[[claim]]
id = "task-add-retries-on-id-collision"
