statement = "作った ID が登録済みの ID と重なったら、ID を作り直して登録する。作り直しても重なり続け、上限の回数に達したら、エラーコード id_conflict を返す。タスクもイベントも記録しない"

[[claim.evidence]]
stage = "テスト"
means = "単体テスト"
detail = "ID の作り方を差し替えて重ね、作り直しと上限の id_conflict を確かめる"

