code = "if _, err := tx.Exec(\"PRAGMA user_version = \" + strconv.Itoa(len(ms))); err != nil {"
reason = "err == nil にすると、書き込めたときに、すぐ後の return nil より先に nil を返すだけになる。書き込めなかったときは、続く return nil で誤りを捨てる。移行の番号を整数で書く PRAGMA が、書き込みのトランザクションを始めた後に失敗する経路は見つけられていない（推測。わざと失敗させる方法がない）"
