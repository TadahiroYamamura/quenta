# 変異テストの除外の一覧。振る舞いの変わらない変異と、道具（Gremlins）がテストの通る箇所を「通らない」と誤る変異を、理由を添えて書く。
# PO がレビューする（除外が増えると抜け道になるため。CLAUDE.md の「変異テスト」）。
# code は、その行のソースの文（前後の空白を除く）。ソースが変わって行がずれると、道具が一致しないことを知らせる

[[exclusion]]
file = "internal/task/task.go"
line = 51
column = 33
type = "ARITHMETIC_BASE"
code = "SessionRequired Failure = iota + 1"
reason = "判定のエラーの種類の値は、互いに比べるだけで、出力にも保存にも使わない。iota - 1 にしても、6 つの値は互いに違うままなので、振る舞いは変わらない"

[[exclusion]]
file = "internal/task/task.go"
line = 122
column = 31
type = "ARITHMETIC_BASE"
code = "Completing FinishKind = iota + 1"
reason = "完了か中止かの値は、互いに比べるだけで、出力にも保存にも使わない。iota - 1 にしても、2 つの値は互いに違うままなので、振る舞いは変わらない"

[[exclusion]]
file = "internal/task/task.go"
line = 162
column = 13
type = "CONDITIONALS_NEGATION"
code = "case found == nil:"
reason = "道具の誤認。Go の網羅率は switch の case の式を区画に入れないので、Gremlins が「テストが通らない」と出す。手で found != nil に壊すと、internal/task のプロパティベーステストが落ちることを確かめた（2026-10-28）"

[[exclusion]]
file = "internal/store/store.go"
line = 27
column = 23
type = "ARITHMETIC_BASE"
code = "const BusyTimeout = 5 * time.Second"
reason = "道具の誤認。定数の宣言は網羅率の区画に入らないので、Gremlins が「テストが通らない」と出す。手で 5 / time.Second（待たない）に壊すと、DB のインターフェースのテスト（1 秒以上待つことを確かめる）が落ちることを確かめた（2026-10-28）"

