# 変異テストの除外の一覧。振る舞いの変わらない変異と、道具（Gremlins）がテストの通る箇所を「通らない」と誤る変異を、理由を添えて書く。
# PO がレビューする（除外が増えると抜け道になるため。CLAUDE.md の「変異テスト」）。
# status は、Gremlins の結果の種類（LIVED: 生き残った、NOT COVERED: テストが通らないと道具が判断した）。結果の種類が変われば、除外に当たらない
# code は、その行のソースの文（前後の空白を除く）。ソースが変わって行がずれると、道具が一致しないことを知らせる

[[exclusion]]
file = "internal/task/task.go"
line = 51
status = "NOT COVERED"
column = 33
type = "ARITHMETIC_BASE"
code = "SessionRequired Failure = iota + 1"
reason = "道具の誤認。定数の宣言は網羅率の区画に入らないので、Gremlins が「テストが通らない」と出す。手で iota - 1 に壊すと、TitleRequired が 0（知らない値）になり、Test判定のエラーのすべての種類に説明の文がある が落ちることを確かめた（2026-10-28）"

