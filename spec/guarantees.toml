property = "ErrorCodesDistinct"
ensures = 0
fingerprint = "sha256:c8f4cfeddc080cf7"
importance = "中"
guards = ["証明"]
proofs = ["ErrorCode"]
code = ["internal/task"]
rationale = "実装は ErrorCode の値をそのまま出すので、違うエラーが同じコードになることはない"

