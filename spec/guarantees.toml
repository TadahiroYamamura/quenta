# ---------- 前提（Dafny の外の事実） ----------

[[guarantee]]
id = "id-taken-observed"
property = "IdTakenObserved"
fingerprint = "sha256:75a1bcd1efab02f0"
importance = "高"
guards = ["DB の制約", "テスト"]
constraints = ["tasks_id_unique"]
code = ["internal/store", "internal/app"]
rationale = "Go は、保存と同じトランザクションの中で、その ID のタスクがあるかを調べて NewTask に渡す。調べ違えても、一意の制約が重なる保存を拒む。ID の作り方を差し替えてわざと重ねるテストで、作り直す経路を通す"

[[guarantee]]
id = "found-observed"
property = "FoundObserved"
fingerprint = "sha256:639ac930aa29360c"
importance = "高"
guards = ["実行時の確認", "テスト"]
code = ["internal/store"]
approved = "2026-10-26"
rationale = "Go は、保存と同じトランザクションの中で、ID を条件にタスクを探して Finish・ShowTask に渡す。DB の制約では守れない。別のタスクを返す（取り違え）は、探した結果の ID が指定した ID と一致するかを実行時に確かめ、違えば internal のエラーにする。確認がはたらくことは、探す処理をわざと別の行を返すよう差し替えるテストで確かめる。あるのに無いと返すことは、プロパティベースのテストで、毎歩、実装の結果を手本（状態から正しく探す）と比べて守る。テストと実行時の確認で守ることは 2026-10-26 に人が了承した"

[[guarantee]]
id = "applied-like-model"
property = "AppliedLikeModel"
fingerprint = "sha256:4a216e074391b53f"
importance = "高"
guards = ["DB の制約", "テスト"]
constraints = ["tasks_no_delete", "tasks_only_status_changes", "tasks_finished_frozen", "events_no_update", "events_no_delete", "tasks_id_unique", "events_task_fk"]
code = ["internal/store", "internal/task"]
approved = "2026-10-26"
rationale = "エラーなら何も変えないことは、保存の層が仕様の関数の成功の結果しか受け取らない Go の作りとテストで守る。成功の結果を手本と同じ形で反映することのうち、タスクの削除・上書き・状態以外の書き換え・終わったタスクの書き換えと、イベントの書き換え・削除は、DB の制約が拒む。保存の層が受け取るのは仕様の関数が作った状態の変更だけで、1 つの関数がタスクとイベントを 1 つのトランザクションで書く。DB で守れない部分のうち、状態の書き換えにイベントが 1 件だけ伴う・ID を条件に 1 行だけ書き換える・新しい行が末尾に入る、を Go の作りとテストで守ることは 2026-10-25 に、エラーなら変えない、は 2026-10-26 に人が了承した"

[[guarantee]]
id = "stored-state-valid"
property = "Valid"
fingerprint = "sha256:9cbf0ed63625b55a"
importance = "高"
guards = ["DB の制約", "実行時の確認", "テスト"]
constraints = ["tasks_id_unique", "events_task_fk"]
premises = ["applied-like-model", "id-taken-observed", "found-observed"]
code = ["internal/store", "internal/task"]
rationale = "帰納法で守る。空の DB は不変条件を満たし（empty-is-valid）、実装の登録・完了・中止は、前提のもとで不変条件を保つ（impl-add-preserves-valid・impl-finish-preserves-valid。これらは「操作の前の DB が不変条件を満たす」ことを前提にするので、この行と互いを指しあうが、帰納法の仮定であって循環ではない）。加えて、DB から読んだタスクは仕様の関数に渡す前に ValidTask で確かめ、プロパティベースのテストで、毎歩、実装の状態に Valid を当てる"

