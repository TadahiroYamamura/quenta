# ---------- エラーコード ----------

[[guarantee]]
id = "error-code"
property = "ErrorCode"
fingerprint = "sha256:dbdb0a404a96550c"
importance = "中"
guards = ["証明"]
proofs = ["ErrorCode"]
code = ["internal/task", "internal/cli"]
rationale = "CLI がエラーの JSON の code に出す文字列は、仕様の ErrorCode が返す値そのもの。エラーを足して書き分けを忘れると dafny verify が止まる"

